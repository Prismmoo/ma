<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0a10" />
    <meta
      name="description"
      content="NN Cyberspace — futuristic art, physical canvases, and immersive spatial experiences."
    />
    <title>NN Cyberspace</title>

    <!-- Start DNS/TLS negotiation before React mounts. -->
    <link
      rel="dns-prefetch"
      href="//noureddinelmobaraki-web.github.io"
    />
    <link
      rel="preconnect"
      href="https://noureddinelmobaraki-web.github.io"
    />

    <!-- Ask the browser to discover the hero video as early as possible on desktop. -->
    <link
      rel="preload"
      href="https://noureddinelmobaraki-web.github.io/nl-audio-cdn/lu.bg.webm"
      as="video"
      type="video/webm"
      media="(min-width: 1024px)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
