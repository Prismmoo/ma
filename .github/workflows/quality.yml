name: Quality — PRISM

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-prism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
      - name: Catalog audit
        run: npm run audit:catalog
        continue-on-error: true
